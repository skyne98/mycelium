[package]
name = "mycelium"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
loro = "1.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
quinn = "0.11"
rustls = "0.23"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
bytes = "1"
rustls-pemfile = "2"
rustls-native-certs = "0.8"
